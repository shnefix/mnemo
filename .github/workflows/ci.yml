name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint
        run: ./gradlew ktlintCheck --no-daemon
      - name: Desktop tests
        run: ./gradlew :composeApp:desktopTest --no-daemon
      - name: Test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-test-results
          path: composeApp/build/test-results/desktopTest

  android-release:
    # Builds the R8-minified release APK so shrinker breakage shows up before a phone install.
    # No keystore in CI, so it is signed with the debug key; it is only a build check.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Release APK
        run: ./gradlew :composeApp:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: mnemo-release-apk
          path: composeApp/build/outputs/apk/release/*.apk
